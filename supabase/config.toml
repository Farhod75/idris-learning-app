# =============================================================================
# supabase/config.toml — Local development configuration
# Project: Idris Learning App
# Author:  Farhod Elbekov
#
# Usage:
#   supabase start      — starts local Supabase stack (Postgres + Auth + Storage + Studio)
#   supabase stop       — stops local stack
#   supabase db reset   — wipes local DB and reruns all migrations + seed.sql
#   supabase db diff    — generates a new migration from schema changes
#   supabase functions serve — runs edge functions locally
#
# Local URLs (after supabase start):
#   Studio:    http://localhost:54323
#   API:       http://localhost:54321
#   DB:        postgresql://postgres:postgres@localhost:54322/postgres
#   Inbucket:  http://localhost:54324  (catches all outgoing emails locally)
# =============================================================================

[api]
enabled = true
port = 54321
# Schemas exposed via REST and GraphQL
schemas = ["public", "storage", "graphql_public"]
# Extra search_path for PostgREST
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"
heartbeat_interval_ms = 30000
max_header_length = 4096

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
# Opens Studio in browser after supabase start
openBrowser = false

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[auth]
enabled = true
# We use a simple token-based doctor portal (no full auth system)
# See DOCTOR_INTEGRATION.md section 9 for the token approach
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# TTS function — proxies ElevenLabs with mama's cloned voice
# Env vars are set via: supabase secrets set KEY=value
# See supabase/functions/tts/README.md for setup instructions
[[functions]]
name = "tts"
verify_jwt = false          # iPad app calls without auth token
import_map = "./functions/import_map.json"

[analytics]
enabled = false             # no external analytics in local dev

[experimental]
oriole_preview = false
